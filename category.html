<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="description" content="Explore premium Category Detail Chennai at Interior Spot, Chennai's top destination for interior decorative materials.">
    <meta name="keywords" content="category detail chennai, interior spot, laminates, chennai interiors, decorative sheets, wall panels">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Detail | Interior Spot Chennai</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/next-level.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .category-hero {
            height: 400px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            margin-bottom: 0;
        }

        .category-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-content h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .hero-content p {
            font-size: 18px;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .content-section {
            padding: 120px 0 80px;
        }

        .section-title {
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 15px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background: var(--primary);
        }

        .spec-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .spec-card:hover {
            transform: translateY(-5px);
            border-bottom-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .spec-card i {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
        }

        .spec-card h4 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .spec-card p,
        .spec-card li {
            font-size: 16px;
            color: var(--secondary);
            font-weight: 600;
            line-height: 1.5;
        }

        .quote-banner {
            background: var(--secondary);
            color: white;
            padding: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 60px;
            flex-wrap: wrap;
            gap: 30px;
        }

        .quote-text h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .btn-white {
            background: white;
            color: var(--secondary);
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-white:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>

<body>

    

    <header id="site-header"></header>

    <div id="category-hero-section">
        <!-- Hero will be loaded by products.js -->
    </div>


    

    <div class="container">
        <div id="category-specs" class="content-section">
            <!-- Specs will be loaded by products.js -->
        </div>

        <div class="content-section">
            <h2 class="section-title">Product Catalog</h2>
            <div class="product-grid">
                <!-- Products will be loaded by products.js -->
            </div>
        </div>

        <div class="quote-banner">
            <div class="quote-text">
                <h2>Interested in this collection?</h2>
                <p>Get a customized quotation for your space today.</p>
            </div>
            <a href="contact.html" class="btn-white">Request Quotation</a>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <script src="assets/js/products.js" defer></script>








    <script src="assets/js/components.js" defer></script>
    <script src="assets/js/header-nav.js" defer></script>
</body></html>
